<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dither Blur POC</title>
    <link rel="stylesheet" href="demo.css" />
    <link rel="stylesheet" href="dither-blur.css" />
  </head>
  <body>
    <nav>
      <b>Dither/Blur</b><a href="#">Work</a><a href="#">About</a
      ><a href="#">Contact</a>
    </nav>

    <main><h1>Scroll down</h1></main>

    <footer>
      <h2>Footer</h2>
      <p>Effect is gone once you get here.</p>
    </footer>

    <script>
      // demo content
      const main = document.querySelector("main");
      const LOREM =
        "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.";
      const CARDS = [
        ["shift", "background:linear-gradient(120deg,#ff006e,#8338ec,#3a86ff,#06d6a0)"],
        ["spin", ""],
        ["", "background:repeating-linear-gradient(45deg,#1b1b1b 0 14px,#ffbe0b 14px 28px)"],
        ["blobs", "background:linear-gradient(135deg,#3a86ff,#8338ec)"],
        ["", "background:radial-gradient(circle at 20% 30%,#ff006e,transparent 50%),radial-gradient(circle at 80% 70%,#06d6a0,transparent 50%),radial-gradient(circle at 60% 20%,#ffbe0b,transparent 45%),#1b1b1b"],
        ["pulse", "background:conic-gradient(from 45deg,#ef476f,#ffd166,#06d6a0,#118ab2,#ef476f)"],
        ["", "background:repeating-radial-gradient(circle,#fb5607 0 10px,#ffbe0b 10px 20px)"],
        ["shift", "background:linear-gradient(-45deg,#06d6a0,#118ab2,#073b4c,#ef476f)"],
        ["blobs", "background:repeating-conic-gradient(#8338ec 0 15deg,#3a86ff 15deg 30deg)"],
        ["spin pulse", ""],
      ];
      CARDS.forEach(([cls, style], i) => {
        main.insertAdjacentHTML(
          "beforeend",
          `<div class="card ${cls}" style="${style}"><span>${i + 1}</span></div><p>${LOREM}</p>`,
        );
        if (i === 4) main.insertAdjacentHTML("beforeend", `<div class="marquee"><span>${"Dither · Blur · ".repeat(16)}</span></div>`);
      });
    </script>
    <script type="module">
      import { ditherBlur } from "./dither-blur.js";
      ditherBlur({ stopAt: "footer" });
    </script>
  </body>
</html>
