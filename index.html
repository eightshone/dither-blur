<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dither Blur POC</title>
    <style>
      :root {
        --bg: #f3efe6;
        --fg: #1b1b1b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          17px/1.6 system-ui,
          sans-serif;
      }

      nav {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        gap: 1.5rem;
        padding: 1rem 1.5rem;
        background: var(--fg);
        color: var(--bg);
      }
      nav b {
        margin-right: auto;
      }
      nav a {
        color: inherit;
        text-decoration: none;
        opacity: 0.8;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 2rem 1rem 6rem;
      }
      .card {
        height: 220px;
        border-radius: 12px;
        margin: 2.5rem 0 1rem;
        display: grid;
        place-items: center;
        font: 700 4rem/1 system-ui;
        color: #fff;
      }

      footer {
        min-height: 420px;
        padding: 3rem 1.5rem;
        background: var(--fg);
        color: var(--bg);
      }
    </style>
  </head>
  <body>
    <nav>
      <b>Dither/Blur</b><a href="#">Work</a><a href="#">About</a
      ><a href="#">Contact</a>
    </nav>

    <main><h1>Scroll down</h1></main>

    <footer>
      <h2>Footer</h2>
      <p>Effect is gone once you get here.</p>
    </footer>

    <script>
      // demo content
      const main = document.querySelector("main");
      const LOREM =
        "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.";
      for (let i = 0; i < 10; i++)
        main.insertAdjacentHTML(
          "beforeend",
          `<div class="card" style="background:linear-gradient(135deg,hsl(${i * 36} 80% 55%),hsl(${i * 36 + 60} 80% 40%))">${i + 1}</div><p>${LOREM}</p>`,
        );
    </script>
    <script type="module">
      import { ditherBlur } from "./dither-blur.js";
      ditherBlur({ stopAt: "footer" });
    </script>
  </body>
</html>
